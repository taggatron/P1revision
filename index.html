<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 11 Mock Paper revision 25/26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Year 11 Mock Paper revision 25/26</h1>
        <p>Click on any card to reveal the answer</p>
        <!-- Paper selector: Mock Paper 1 (Year 10) / Mock Paper 2 (Year 11) -->
        <div class="tier-switch" style="margin-top:14px;">
            <span id="paper-label-1" style="color: white; font-weight:600; margin-right:8px;">Mock Paper 1 — Year 10</span>
            <label class="switch">
                <input type="checkbox" id="paper-toggle" aria-label="Toggle mock paper">
                <span class="slider"></span>
            </label>
            <span id="paper-label-2" style="color: white; font-weight:600; margin-left:8px; opacity:0.7;">Mock Paper 2 — Year 11</span>
        </div>
    </header>
    
    <main>
        <div class="flashcard-container" id="flashcard-container">
            <!-- Flashcards will be generated by JavaScript -->
        </div>
    </main>
    
    <footer>
        <p>Click "Reset All Cards" to flip all cards back to questions</p>
        <button id="reset-button">Reset All Cards</button>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
